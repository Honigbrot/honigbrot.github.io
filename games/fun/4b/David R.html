<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake Arena - Fixed</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#0a0a12;
  font-family:Arial, sans-serif;
  user-select:none;
}

canvas{ display:block; background:#11111d; }

#score{
  position:absolute;
  top:15px;
  left:15px;
  color:white;
  font-size:20px;
  font-weight:bold;
  background:rgba(20,20,35,0.75);
  padding:8px 16px;
  border-radius:8px;
}

#game-over-screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.75);
  color:white;
  display:none;
}

#restart-btn{
  padding:10px 25px;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="score">Länge: 0</div>

<div id="game-over-screen">
  <h1>GAME OVER</h1>
  <div id="final-score"></div>
  <button id="restart-btn">Restart</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const worldSize = 3000;
const maxBots = 12;

let player, bots, orbs, particles;
let mouse = {x:innerWidth/2,y:innerHeight/2};
let isGameOver = false;

const scoreEl = document.getElementById("score");
const gameOver = document.getElementById("game-over-screen");
const finalScore = document.getElementById("final-score");
const restartBtn = document.getElementById("restart-btn");

document.addEventListener("mousemove", e=>{
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

function randomColor(){
  return `hsl(${Math.random()*360},90%,60%)`;
}

function init(){
  isGameOver = false;
  gameOver.style.display = "none";

  player = {
    x: worldSize/2,
    y: worldSize/2,
    size: 20,
    speed: 4,
    color:"#00ff88",
    segments:[]
  };

  bots = [];
  orbs = [];
  particles = [];

  for(let i=0;i<player.size;i++){
    player.segments.push({x:player.x,y:player.y});
  }

  for(let i=0;i<400;i++){
    orbs.push({
      x:Math.random()*worldSize,
      y:Math.random()*worldSize,
      r:4+Math.random()*4,
      color:randomColor()
    });
  }

  for(let i=0;i<maxBots;i++) spawnBot();
}

function spawnBot(){
  let bot={
    x:Math.random()*worldSize,
    y:Math.random()*worldSize,
    angle:Math.random()*Math.PI*2,
    speed:2+Math.random(),
    size:10+Math.random()*10,
    color:randomColor(),
    segments:[]
  };

  for(let i=0;i<bot.size;i++){
    bot.segments.push({x:bot.x,y:bot.y});
  }

  bots.push(bot);
}

function movePlayer(){
  if(isGameOver) return;

  let dx = mouse.x - canvas.width/2;
  let dy = mouse.y - canvas.height/2;
  let d = Math.hypot(dx,dy);

  if(d>1){
    player.x += dx/d * player.speed;
    player.y += dy/d * player.speed;
  }

  player.segments.unshift({x:player.x,y:player.y});
  while(player.segments.length > player.size)
    player.segments.pop();

  if(player.x<0||player.y<0||player.x>worldSize||player.y>worldSize){
    endGame();
  }
}

function moveBots(){
  bots.forEach(bot=>{
    bot.angle += (Math.random()-0.5)*0.2;
    bot.x += Math.cos(bot.angle)*bot.speed;
    bot.y += Math.sin(bot.angle)*bot.speed;

    if(bot.x<0||bot.x>worldSize) bot.angle=Math.PI-bot.angle;
    if(bot.y<0||bot.y>worldSize) bot.angle=-bot.angle;

    bot.segments.unshift({x:bot.x,y:bot.y});
    while(bot.segments.length>bot.size)
      bot.segments.pop();
  });
}

function collect(){
  for(let i=orbs.length-1;i>=0;i--){
    let o=orbs[i];
    if(Math.hypot(player.x-o.x,player.y-o.y)<25){
      player.size++;
      orbs.splice(i,1);
      orbs.push({
        x:Math.random()*worldSize,
        y:Math.random()*worldSize,
        r:4+Math.random()*4,
        color:randomColor()
      });
    }
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let camX = player.x;
  let camY = player.y;

  // Orbs
  orbs.forEach(o=>{
    ctx.fillStyle=o.color;
    ctx.beginPath();
    ctx.arc((o.x-camX)+canvas.width/2,(o.y-camY)+canvas.height/2,o.r,0,Math.PI*2);
    ctx.fill();
  });

  // Bots
  bots.forEach(drawSnake.bind(null,camX,camY));

  // Player
  drawSnake(camX,camY,player);

  scoreEl.innerText = "Länge: "+player.size;
}

function drawSnake(camX,camY,snake){
  ctx.fillStyle = snake.color;

  snake.segments.forEach(s=>{
    ctx.beginPath();
    ctx.arc((s.x-camX)+canvas.width/2,(s.y-camY)+canvas.height/2,10,0,Math.PI*2);
    ctx.fill();
  });
}

function loop(){
  movePlayer();
  moveBots();
  collect();
  draw();
  requestAnimationFrame(loop);
}

function endGame(){
  isGameOver=true;
  gameOver.style.display="flex";
  finalScore.innerText="Deine Länge: "+player.size;
}

restartBtn.onclick=init;

window.addEventListener("resize",()=>{
  canvas.width=innerWidth;
  canvas.height=innerHeight;
});

init();
loop();
</script>

</body>
</html>
