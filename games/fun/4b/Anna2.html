<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Deluxe</title>

<style>
body{
    margin:0;
    background:#2c3e50;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Verdana;
    color:white;
}

h1{
    margin:10px;
}

canvas{
    background:#8bc34a;
    border:6px solid #333;
    border-radius:10px;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

#score{
    font-size:28px;
    margin:10px;
    color:gold;
}

#message{
    margin-top:10px;
    font-size:18px;
}
</style>
</head>
<body>

<h1>🐍 Snake Deluxe</h1>
<div id="score">Punkte: 0</div>
<canvas id="game" width="600" height="600"></canvas>
<div id="message">Pfeiltasten steuern</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

const box = 20;
const size = 600;

let snake;
let direction;
let food;
let score;
let gameRunning;

function startGame(){
    snake = [{x:300,y:300}];
    direction = "RIGHT";
    food = randomFood();
    score = 0;
    gameRunning = true;

    scoreText.innerText="Punkte: "+score;
    message.innerText="Pfeiltasten steuern";
}

startGame();

document.addEventListener("keydown",control);

function control(e){

    if(e.code==="Space" && !gameRunning){
        startGame();
        return;
    }

    if(e.key==="ArrowUp" && direction!=="DOWN")
        direction="UP";

    if(e.key==="ArrowDown" && direction!=="UP")
        direction="DOWN";

    if(e.key==="ArrowLeft" && direction!=="RIGHT")
        direction="LEFT";

    if(e.key==="ArrowRight" && direction!=="LEFT")
        direction="RIGHT";
}

function randomFood(){
    return{
        x:Math.floor(Math.random()*30)*box,
        y:Math.floor(Math.random()*30)*box
    };
}

function collision(head,array){
    for(let i=0;i<array.length;i++){
        if(head.x===array[i].x &&
           head.y===array[i].y){
            return true;
        }
    }
    return false;
}

function draw(){

    if(!gameRunning) return;

    // Hintergrund
    ctx.fillStyle="#8bc34a";
    ctx.fillRect(0,0,size,size);

    // Raster
    ctx.strokeStyle="#7cb342";
    for(let i=0;i<size;i+=box){
        ctx.beginPath();
        ctx.moveTo(i,0);
        ctx.lineTo(i,size);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0,i);
        ctx.lineTo(size,i);
        ctx.stroke();
    }

    // Essen (Apfel)
    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.arc(food.x+10, food.y+10, 9, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle="green";
    ctx.fillRect(food.x+8, food.y+1,4,6);

    // Snake zeichnen
    for(let i=0;i<snake.length;i++){

        if(i===0){
            // Kopf
            ctx.fillStyle="#2e7d32";
        }else{
            // Körper
            ctx.fillStyle="#4caf50";
        }

        ctx.fillRect(
            snake[i].x,
            snake[i].y,
            box,
            box
        );

        ctx.strokeStyle="#1b5e20";
        ctx.strokeRect(
            snake[i].x,
            snake[i].y,
            box,
            box
        );

        // Augen beim Kopf
        if(i===0){
            ctx.fillStyle="white";
            ctx.beginPath();
            ctx.arc(snake[i].x+6,snake[i].y+7,2,0,Math.PI*2);
            ctx.arc(snake[i].x+14,snake[i].y+7,2,0,Math.PI*2);
            ctx.fill();
        }
    }

    let x = snake[0].x;
    let y = snake[0].y;

    if(direction==="UP") y-=box;
    if(direction==="DOWN") y+=box;
    if(direction==="LEFT") x-=box;
    if(direction==="RIGHT") x+=box;

    if(x===food.x && y===food.y){
        score++;
        scoreText.innerText="Punkte: "+score;
        food=randomFood();
    }else{
        snake.pop();
    }

    let head={x:x,y:y};

    if(
        x<0 || y<0 ||
        x>=size || y>=size ||
        collision(head,snake)
    ){
        gameRunning=false;

        ctx.fillStyle="rgba(0,0,0,0.5)";
        ctx.fillRect(0,0,size,size);

        ctx.fillStyle="white";
        ctx.font="50px Verdana";
        ctx.fillText("GAME OVER",160,260);

        ctx.font="28px Verdana";
        ctx.fillText(
            "SPACE = Neustart",
            180,
            320
        );

        message.innerText=
            "Game Over | Punkte: "+
            score+
            " | SPACE zum Neustart";
        return;
    }

    snake.unshift(head);
}

setInterval(draw,120);
</script>

</body>
</html>
