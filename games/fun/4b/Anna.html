<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Runner Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#111;font-family:Arial}
canvas{display:block}
#hud{
position:absolute;top:15px;left:15px;
color:white;font-size:24px;
background:rgba(0,0,0,.4);
padding:10px 18px;border-radius:12px;
backdrop-filter:blur(6px);
}
#gameover{
position:absolute;
top:50%;left:50%;
transform:translate(-50%,-50%);
color:white;
font-size:42px;
text-align:center;
display:none;
background:rgba(0,0,0,.7);
padding:25px;border-radius:16px;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">⭐ Punkte: <span id="score">0</span></div>
<div id="gameover">💀 Game Over<br><small>R = Neustart</small></div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;

const lanes=[-140,0,140];
let lane=1,targetX=0;
let score=0,speed=10,gameOver=false;

const player={
x:0,y:0,w:55,h:90,vy:0,jump:false,duck:false
};

let obstacles=[];

function obstacleSpawn(){
 obstacles.push({
   lane:Math.floor(Math.random()*3),
   y:-120,
   w:70,
   h:90
 });
}
setInterval(()=>{if(!gameOver) obstacleSpawn()},700);

addEventListener("keydown",e=>{
 if(gameOver && e.key.toLowerCase()=="r"){restart();return;}
 if(e.key=="ArrowLeft"&&lane>0){lane--;targetX=lanes[lane]}
 if(e.key=="ArrowRight"&&lane<2){lane++;targetX=lanes[lane]}
 if(e.key=="ArrowUp"&&!player.jump){
  player.vy=-20;player.jump=true;
 }
 if(e.key=="ArrowDown") player.duck=true;
});
addEventListener("keyup",e=>{
 if(e.key=="ArrowDown") player.duck=false;
});

function restart(){
 score=0;
 speed=10;
 obstacles=[];
 gameOver=false;
 lane=1;
 targetX=0;
 document.getElementById("gameover").style.display="none";
}

function update(){
 if(gameOver)return;

 score++;
 if(score%600==0)speed+=0.6;

 player.x+=(targetX-player.x)*0.25;
 player.vy+=1;
 player.y+=player.vy;

 if(player.y>0){
  player.y=0;
  player.vy=0;
  player.jump=false;
 }

 for(let o of obstacles){
  o.y+=speed;

  let ox=c.width/2+lanes[o.lane];
  let oy=o.y;

  let px=c.width/2+player.x;
  let py=c.height-140+player.y;
  let ph=player.duck?45:player.h;

  if(
    ox<px+player.w &&
    ox+o.w>px &&
    oy<py+ph &&
    oy+o.h>py
  ){
    gameOver=true;
    document.getElementById("gameover").style.display="block";
  }
 }
 obstacles=obstacles.filter(o=>o.y<c.height+100);
 document.getElementById("score").textContent=score;
}

function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,c.height);
 g.addColorStop(0,"#4facfe");
 g.addColorStop(1,"#eaf6ff");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,c.width,c.height);

 // Stadt
 for(let i=0;i<12;i++){
  let x=i*180;
  let h=120+Math.sin(i)*60;
  ctx.fillStyle="#2f3c55";
  ctx.fillRect(x,c.height-320-h,140,h);
 }
}

function drawRoad(){
 ctx.fillStyle="#2f2f2f";
 ctx.fillRect(c.width/2-250,0,500,c.height);

 ctx.strokeStyle="#ddd";
 ctx.lineWidth=4;
 ctx.setLineDash([35,25]);
 for(let i=1;i<3;i++){
  let x=c.width/2-250+i*166;
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,c.height);
  ctx.stroke();
 }
 ctx.setLineDash([]);
}

function drawPlayer(){
 let px=c.width/2+player.x;
 let py=c.height-140+player.y;

 // Schatten
 ctx.fillStyle="rgba(0,0,0,.3)";
 ctx.beginPath();
 ctx.ellipse(px+25,c.height-45,35,10,0,0,Math.PI*2);
 ctx.fill();

 // Figur
 ctx.fillStyle="#00ff9d";
 ctx.beginPath();
 ctx.roundRect(px,py,player.w,player.duck?45:player.h,12);
 ctx.fill();

 // Kopf
 ctx.fillStyle="#ffe0b2";
 ctx.beginPath();
 ctx.arc(px+27,py-10,16,0,Math.PI*2);
 ctx.fill();
}

function drawObstacles(){
 for(let o of obstacles){
   let x=c.width/2+lanes[o.lane];
   let y=o.y;

   // Hindernis moderner Look
   let grad=ctx.createLinearGradient(x,y,x,y+o.h);
   grad.addColorStop(0,"#ff7b7b");
   grad.addColorStop(1,"#d90429");

   ctx.fillStyle=grad;
   ctx.beginPath();
   ctx.roundRect(x,y,o.w,o.h,14);
   ctx.fill();

   // Highlight
   ctx.fillStyle="rgba(255,255,255,.25)";
   ctx.fillRect(x+8,y+8,o.w-16,10);
 }
}

function loop(){
 update();
 drawBackground();
 drawRoad();
 drawObstacles();
 drawPlayer();
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
