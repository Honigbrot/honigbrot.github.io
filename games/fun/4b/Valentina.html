<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Runner</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
    font-family:Arial;
}

#score{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

#restartBtn{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:22px;
    padding:12px 20px;
    display:none;
}

canvas{
    display:block;
    margin:auto;
}
</style>
</head>

<body>

<div id="score">Score: 0</div>
<button id="restartBtn">Neustart</button>
<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 900;
canvas.height = 500;

let score = 0;
let gameOver = false;
let speed = 7;

const lanes = [250, 400, 550];

const player = {
    lane: 1,
    x: lanes[1],
    y: 360,
    w: 40,
    h: 80,
    frame: 0
};

let obstacles = [];

const restartBtn = document.getElementById("restartBtn");
const scoreText = document.getElementById("score");

// Steuerung
document.addEventListener("keydown",(e)=>{

    if(gameOver) return;

    if(e.code==="ArrowLeft"){
        player.lane = Math.max(0, player.lane-1);
    }

    if(e.code==="ArrowRight"){
        player.lane = Math.min(2, player.lane+1);
    }

    player.x = lanes[player.lane];
});

function spawn(){
    obstacles.push({
        lane: Math.floor(Math.random()*3),
        y: -100
    });
}

setInterval(spawn, 900);

function collide(o){
    return player.lane === o.lane && Math.abs(o.y - player.y) < 40;
}

function reset(){

    score = 0;
    speed = 7;
    gameOver = false;
    obstacles = [];

    player.lane = 1;
    player.x = lanes[1];

    restartBtn.style.display = "none";
    scoreText.innerText = "Score: 0";
}

reset();

function update(){

    player.frame += 0.25;

    for(let i=obstacles.length-1;i>=0;i--){

        obstacles[i].y += speed;

        if(collide(obstacles[i])){
            gameOver = true;
            restartBtn.style.display = "block";
        }

        if(obstacles[i].y > 600){
            obstacles.splice(i,1);
            score++;
            scoreText.innerText = "Score: " + score;
        }
    }

    speed += 0.001;
}

function drawStreet(){

    ctx.fillStyle="#444";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#555";
    ctx.fillRect(150,0,600,500);

    ctx.strokeStyle="white";
    ctx.lineWidth=3;

    for(let i=1;i<3;i++){
        ctx.beginPath();
        ctx.moveTo(lanes[i],0);
        ctx.lineTo(lanes[i],500);
        ctx.stroke();
    }
}

function drawStickman(){

    let swing = Math.sin(player.frame) * 10;

    ctx.strokeStyle="black";
    ctx.lineWidth=3;

    // Kopf
    ctx.beginPath();
    ctx.arc(player.x, player.y-30, 10, 0, Math.PI*2);
    ctx.stroke();

    // Körper
    ctx.beginPath();
    ctx.moveTo(player.x, player.y-20);
    ctx.lineTo(player.x, player.y+10);
    ctx.stroke();

    // Arme (laufen)
    ctx.beginPath();
    ctx.moveTo(player.x, player.y-5);
    ctx.lineTo(player.x-15, player.y-5 + swing);
    ctx.moveTo(player.x, player.y-5);
    ctx.lineTo(player.x+15, player.y-5 - swing);
    ctx.stroke();

    // Beine (laufen)
    ctx.beginPath();
    ctx.moveTo(player.x, player.y+10);
    ctx.lineTo(player.x-15, player.y+30 - swing);
    ctx.moveTo(player.x, player.y+10);
    ctx.lineTo(player.x+15, player.y+30 + swing);
    ctx.stroke();
}

function drawObstacles(){

    ctx.fillStyle="#0b6623";

    obstacles.forEach(o=>{
        ctx.beginPath();
        ctx.arc(lanes[o.lane], o.y, 20, 0, Math.PI*2);
        ctx.fill();
    });
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawStreet();

    drawObstacles();

    drawStickman();

    if(gameOver){
        ctx.fillStyle="rgba(0,0,0,0.5)";
        ctx.fillRect(0,0,canvas.width,500);

        ctx.fillStyle="white";
        ctx.font="50px Arial";
        ctx.fillText("GAME OVER",250,250);
    }
}

function loop(){
    if(!gameOver) update();
    draw();
    requestAnimationFrame(loop);
}

loop();

restartBtn.onclick = reset;

</script>
</body>
</html>
