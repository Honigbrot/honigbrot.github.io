<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ein interaktiver Pizzateig-Rechner für verschiedene Pizzastile." />
  <title>Pizzateig-Rechner</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <header>
    <a class="site-link" href="../">Honigbrot</a>
    <h1>Pizza<span>teig</span>-Rechner</h1>
    <p>Wähle deinen Stil, stelle deine Werte ein, backe perfekte Pizza.</p>
  </header>

  <main class="layout">
    <section aria-labelledby="styleTitle">
      <h2 id="styleTitle">Pizzastil</h2>
      <div class="style-grid" id="styleGrid" aria-label="Pizzastil auswählen"></div>
      <div class="style-info" id="styleInfo"></div>
    </section>

    <section aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Dein Ansatz</h2>
      <div class="controls-grid">
        <div class="control">
          <label for="sliderPizzas">Pizzen <span id="valPizzas">2</span></label>
          <input type="range" id="sliderPizzas" min="1" max="12" value="2" step="1" />
          <div class="range-labels"><span>1</span><span>12</span></div>
        </div>
        <div class="control">
          <label for="sliderWeight">Teiglingsgewicht <span id="valWeight">280</span>g</label>
          <input type="range" id="sliderWeight" min="150" max="500" value="280" step="10" />
          <div class="range-labels"><span>150g</span><span>500g</span></div>
        </div>
        <div class="control">
          <label for="sliderHydration">Hydration <span id="valHydration">65</span>%</label>
          <input type="range" id="sliderHydration" min="50" max="90" value="65" step="1" />
          <div class="range-labels"><span>50%</span><span>90%</span></div>
        </div>
        <div class="control">
          <label for="sliderSalt">Salz <span id="valSalt">2,5</span>%</label>
          <input type="range" id="sliderSalt" min="1.5" max="3.5" value="2.5" step="0.1" />
          <div class="range-labels"><span>1,5%</span><span>3,5%</span></div>
        </div>
        <div class="control" id="ctrlYeast">
          <label for="sliderYeast">Hefe <span id="valYeast">0,1</span>%</label>
          <input type="range" id="sliderYeast" min="0.05" max="2" value="0.1" step="0.01" />
          <div class="range-labels"><span>0,05%</span><span>2%</span></div>
        </div>
        <div class="control" id="ctrlOil">
          <label for="sliderOil">Öl <span id="valOil">2</span>%</label>
          <input type="range" id="sliderOil" min="0" max="8" value="2" step="0.5" />
          <div class="range-labels"><span>0%</span><span>8%</span></div>
        </div>
      </div>
    </section>

    <section aria-labelledby="recipeTitle">
      <div class="recipe-header">
        <h2 id="recipeTitle">Rezept</h2>
        <div class="total-weight" id="totalWeight"></div>
      </div>
      <div class="ingredients" id="ingredients"></div>
    </section>

    <section aria-labelledby="stepsTitle">
      <div class="steps-header">
        <h2 id="stepsTitle">Schritt für Schritt</h2>
        <div class="steps-actions">
          <span class="progress-text" id="progressText"></span>
          <button class="btn-reset" id="btnReset">Zurücksetzen</button>
        </div>
      </div>
      <div class="steps" id="steps"></div>
      <div class="tip" id="tip"></div>
    </section>
  </main>

  <script src="../assets/app.js" defer></script>
</body>
</html>
